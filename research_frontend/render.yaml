services:
  - type: web
    name: edubot-research-frontend
    runtime: static
    rootDir: research_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://edu-chatbot-1-2m2i.onrender.com
