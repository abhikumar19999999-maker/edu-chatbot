<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Register - EduBot</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>

<body>

  <div class="auth-page">

    <div class="auth-card">

      <div class="auth-logo">
        Edu<span>Bot</span>
      </div>

      <h1>Create account</h1>

      <p>
        Start your personalized learning journey.
      </p>

      <form id="registerForm">

        <div class="form-group">

          <label>Name</label>

          <input
            type="text"
            id="name"
            placeholder="Your name"
            required
          />

        </div>

        <div class="form-group">

          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          />

        </div>

        <div class="form-group">

          <label>Password</label>

          <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
          />

        </div>

        <button type="submit">
          Create Account
        </button>

        <p id="registerMessage"></p>

      </form>

      <p class="auth-footer">

        Already have an account?

        <a href="/login.html">
          Login
        </a>

      </p>

    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

</body>
</html>
