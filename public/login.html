<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login - EduBot</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>

<body>

  <div class="auth-page">

    <div class="auth-card">

      <div class="auth-logo">
        Edu<span>Bot</span>
      </div>

      <h1>Welcome back</h1>

      <p>
        Sign in to continue learning.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label>Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          />
        </div>

        <button type="submit">
          Login
        </button>

        <p id="loginMessage"></p>

      </form>

      <p class="auth-footer">
        Don't have an account?
        <a href="/register.html">
          Create one
        </a>
      </p>

    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

</body>
</html>
